name: Vanguard Update Tracker

on:
  schedule:
    - cron: '0 * * * *'  # 1時間ごとに実行
  workflow_dispatch:      # 手動でも実行できるようにする

jobs:
  check-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # バージョン記録ファイルをリポジトリに保存（commit）するために必要
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Commit and push if version changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_vanguard_version.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Update Vanguard version cache" && git push)
